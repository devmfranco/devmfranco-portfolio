name: Update Repos Cache

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */12 * * *'  
  workflow_dispatch:       

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and cache repos
        run: |
          curl -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/users/devmfranco/repos?sort=updated&per_page=50" \
               -o raw-repos.json

          node -e "
          const fs = require('fs');
          try {
            const repos = require('./raw-repos.json');
            if (Array.isArray(repos) && repos.length > 0) {
              const exclude = ['devmfranco.github.io'];
              const filtered = repos.filter(r => !exclude.includes(r.name));
              fs.writeFileSync('repos.json', JSON.stringify(filtered, null, 2));
            }
          } catch(e) {
            console.log('Using local repos fallback');
          }
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update repos cache" && git push)